{% args id:, booster_id:, booster_title:, booster_version:, label:, content:, message_id: %}
<div id="boost_{{ id }}" class="boost boost-item flex-inline postion--relative max-width align-center fill-white gap" data-controller="boost-delete" data-boost-delete-perform-class="boost--deleting" data-boost-delete-reveal-class="expanded" data-boost-delete-booster-id-value="{{ booster_id }}">
  <figure class="avatar boost__avatar flex-item-no-shrink">
    <a title="{{ booster_title }}" class="btn avatar" data-turbo-frame="_top" href="/users/{{ booster_id }}"><img aria-label="{{ label }}" src="/users/{{ rails_signed_id booster_id, purpose: "user/avatar", secret: :secret_key }}/avatar?v={{ booster_version }}" width="48" height="48" /></a>
  </figure>

  {{ partial :boost_content, content: content }}

  <form class="button_to" method="post" action="/messages/{{ message_id }}/boosts/{{ id }}"><input type="hidden" name="_method" value="delete"><button data-action="boost-delete#perform" data-boost-delete-target="button" class="btn btn--negative flex-item-justify-end boost__delete" type="submit">
    <img aria-hidden="true" src="{{ asset_path "minus.svg" }}" width="20" height="20">
    <span class="for-screen-reader">Delete this boost</span>
  </button></form>
</div>
<span id="delete_boost_accessible_label" class="for-screen-reader">Press enter to delete this boost</span>
