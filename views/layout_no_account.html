    {{ yield :head }}
  </head>

  <body class="{{ yield :body_class }}" data-controller="local-time lightbox">
    <a href="#main-content" class="skip-navigation btn">Skip to main content</a>

    <nav id="nav">
      {{ yield :nav }}
    </nav>

    {% if flash_on %}
      <div class="flash" data-controller="element-removal" data-action="animationend->element-removal#remove">
        {% if flash_alert %}
        <div class="flash__inner shadow" style="--flash-background: var(--color-negative)">
          <img aria-hidden="true" width="24" height="24" class="colorize--white" src="{{ asset_path "alert.svg" }}">
        </div>
        {% else %}
        <div class="flash__inner shadow" style="">
          <img aria-hidden="true" width="24" height="24" class="colorize--white" src="{{ asset_path "check.svg" }}">
        </div>
        {% endif %}
        <span class="for-screen-reader" role="alert" aria-atomic="true">{{ flash_text }}</span>
      </div>
    {% endif %}

    <main id="main-content">
      {{ yield }}

      <footer id="footer">
        {{ yield :footer }}
      </footer>
    </main>

    <aside id="sidebar" data-controller="toggle-class" data-toggle-class-toggle-class="open">
      {{ yield :sidebar }}
    </aside>

    <dialog class="lightbox" aria-label="Image Viewer (Press escape to close)" data-lightbox-target="dialog" data-action="close->lightbox#reset">
      <img src="" class="lightbox__image" data-lightbox-target="zoomedImage">

      <form method="dialog" class="lightbox__btn">
        <button class="btn">
          <img aria-hidden="true" src="{{ asset_path "remove.svg" }}">
          <span class="for-screen-reader">Close image viewer</span>
        </button>
      </form>

      <a href="" class="lightbox__btn--download btn hide-in-ios-pwa" data-lightbox-target="download">
        <img aria-hidden="true" src="{{ asset_path "download.svg" }}">
        <span class="for-screen-reader">Download file</span>
      </a>

      <button class="lightbox__btn--share btn" data-controller="web-share" data-action="web-share#share" data-web-share-files-value="" data-lightbox-target="share">
        <img aria-hidden="true" src="{{ asset_path "share.svg" }}">
        <span class="for-screen-reader">Share file</span>
      </button>
    </dialog>

    <a href="https://once.com" id="app-logo" target="_blank" aria-label="Once software from 37signals home page">
      <img alt="Campfire logo" width="256" height="216" src="{{ asset_path "campfire-icon.png" }}">
    </a>
  </body>
</html>
