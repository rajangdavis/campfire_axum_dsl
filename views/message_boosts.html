{% args id:, param:, boosts: %}
<turbo-frame id="boosting_message_{{ param }}">
  <div class="boosts flex flex-wrap align-center gap full-width" style="--column-gap: 0.4ch; --row-gap: 0" data-controller="turbo-streaming" data-action="turbo:submit-start->turbo-streaming#unsubscribe">
    <div class="flex-inline flex-wrap gap" id="boosts_message_{{ param }}" data-turbo-streaming-target="container">
      {% for boost in boosts %}
      {{ partial :boost, id: boost.id, booster_id: boost.booster_id, booster_title: boost.booster_title, booster_version: boost.booster_version, label: boost.label, content: boost.content, message_id: id }}
      {% endfor %}
    </div>

    <turbo-frame id="new_boost_message_{{ param }}">
      <div class="flex-inline message__boost-inline" data-controller="soft-keyboard">
        <a class="boost__action txt-small btn" action="soft-keyboard#open" href="/messages/{{ id }}/boosts/new">
          <img aria-hidden="true" src="{{ asset_path "boost.svg" }}" width="20" height="20">
          <span class="for-screen-reader">Add a boost</span>
        </a>
      </div>
    </turbo-frame>
  </div>
</turbo-frame>
