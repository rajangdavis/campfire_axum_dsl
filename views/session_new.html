<section class="sign-in">
  <form method="post" action="/session">
    <label>Email <input type="email" name="email_address" required autofocus autocomplete="username" placeholder="Enter your email address"></label>
    <label>Password <input type="password" name="password" required autocomplete="current-password" maxlength="72" placeholder="Enter your password"></label>
    <button type="submit" name="log_in">Go</button>
  </form>
</section>
