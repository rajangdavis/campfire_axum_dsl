{% if has_fresh %}<turbo-stream action="append" target="messages_rooms_{{ kind }}_{{ room_id }}"><template>{{ partial :message_list, messages: fresh, base_url: base_url }}</template></turbo-stream>{% endif %}
{% for message in updated %}<turbo-stream action="replace" target="message_{{ message.param }}"><template>{{ partial :message, id: message.id, param: message.param, creator_id: message.creator_id, creator_name: message.creator_name, creator_title: message.creator_title, avatar_version: message.avatar_version, created_ms: message.created_ms, updated_ms: message.updated_ms, created_iso: message.created_iso, room_id: message.room_id, room_label: message.room_label, body: message.body, base_url: base_url, boosts: message.boosts, presentation: message.presentation, mentions: message.mentions, renderable: message.renderable }}</template></turbo-stream>{% endfor %}
