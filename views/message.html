{% args message_id:, creator_name:, created_at:, body: %}
<article class="message" id="message_{{ message_id }}" data-message-id="{{ message_id }}">
  <h3 class="message__heading"><strong class="message__author">{{ creator_name }}</strong> <time class="message__timestamp">{{ created_at }}</time></h3>
  <div class="message__body">{{ body|sanitize }}</div>
</article>
