{% args bot_id:, name:, title:, avatar_version:, bot_key:, rooms:, base_url: %}
<li class="flex flex-column gap flush fill-shade border-radius pad-block pad-inline-double">
  <div class="flex align-center gap">
    <figure class="avatar flex-item--no-shrink" style="--avatar-size: 2.65em;">
      <a title="{{ title }}" class="btn avatar" data-turbo-frame="_top" href="/users/{{ bot_id }}"><img aria-hidden="true" loading="lazy" src="/users/{{ rails_signed_id bot_id, purpose: "user/avatar", secret: :secret_key }}/avatar?v={{ avatar_version }}" width="48" height="48" /></a>
    </figure>

    <div class="min-width">
      <div class="overflow-ellipsis txt-large"><strong>{{ name }}</strong></div>
    </div>

    <a class="btn flex-item-justify-end" style="view-transition-name: chat-bot-{{ bot_id }}" href="/account/bots/{{ bot_id }}/edit">
      <img aria-hidden="true" src="{{ asset_path "pencil.svg" }}" width="20" height="20" />
      <span class="for-screen-reader">Edit {{ name }}</span>
    </a>
  </div>

  {% for room in rooms %}
    <fieldset class="gap max-width pad border border-radius">
      <legend class="min-width txt-align-start pad-inline">
        <strong class="overflow-ellipsis">{{ room.name }}</strong>
      </legend>
      <div class="flex align-center gap">
        <img aria-hidden="true" class="colorize--black" src="{{ asset_path "messages-outlined.svg" }}" width="24" height="24" />
        <div class="flex-item-grow">
          <input type="text" class="input full-width fill-white" value="curl -d 'Hello!' {{ base_url }}/rooms/{{ room.id }}/{{ bot_key }}/messages" aria-label="curl command for posting messages" readonly>
        </div>
        <div class="txt-small">
          <button class="btn" data-controller="copy-to-clipboard" data-action="copy-to-clipboard#copy" data-copy-to-clipboard-success-class="btn--success" data-copy-to-clipboard-content-value="curl -d 'Hello!' {{ base_url }}/rooms/{{ room.id }}/{{ bot_key }}/messages">
            <img aria-hidden="true" src="{{ asset_path "copy-paste.svg" }}" width="20" height="20" />
            <span class="for-screen-reader">Copy message command</span>
          </button>
        </div>
      </div>
      <div class="flex align-center gap">
        <img aria-hidden="true" class="colorize--black" src="{{ asset_path "attachment.svg" }}" width="24" height="24" />
        <div class="flex-item-grow">
          <input type="text" class="input full-width fill-white" value="curl -F &quot;attachment=@/path/to/file&quot; {{ base_url }}/rooms/{{ room.id }}/{{ bot_key }}/messages" aria-label="curl command for posting attachments" readonly>
        </div>
        <div class="txt-small">
          <button class="btn" data-controller="copy-to-clipboard" data-action="copy-to-clipboard#copy" data-copy-to-clipboard-success-class="btn--success" data-copy-to-clipboard-content-value="curl -F &quot;attachment=@/path/to/file&quot; {{ base_url }}/rooms/{{ room.id }}/{{ bot_key }}/messages">
            <img aria-hidden="true" src="{{ asset_path "copy-paste.svg" }}" width="20" height="20" />
            <span class="for-screen-reader">Copy attachment command</span>
          </button>
        </div>
      </div>
    </fieldset>
  {% endfor %}
</li>
