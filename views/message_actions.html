{% args id:, param:, room_id:, base_url:, presentation: %}
<div class="message__actions" data-controller="soft-keyboard">
  <details class="position-relative" data-controller="popup" data-action="keydown.esc->popup#close toggle->popup#toggle click@document->popup#closeOnClickOutside" data-popup-orientation-top-class="popup-orientation-top">
    <summary class="btn message__action-btn message__options-btn">
      <img class="colorize--black" aria-hidden="true" src="{{ asset_path "menu-dots-horizontal.svg" }}" width="20" height="20">
      <span class="for-screen-reader">Message options</span>
    </summary>

    <div class="message__actions-menu border shadow" data-popup-target="menu">
      <div class="quick-boosts">
        <form data-turbo-frame="boosting_message_{{ param }}" data-action="popup#close" action="/messages/{{ id }}/boosts" accept-charset="UTF-8" method="post">
          <input type="hidden" name="boost[content]" id="boost_content" value="👍">
          <button name="button" type="submit" title="Thumbs up" class="btn message__action-btn" data-emoji="👍">
            <figure class="margin-none boost-character">👍</figure>
            <span class="for-screen-reader">Thumbs up</span>
          </button>
        </form>
        <form data-turbo-frame="boosting_message_{{ param }}" data-action="popup#close" action="/messages/{{ id }}/boosts" accept-charset="UTF-8" method="post">
          <input type="hidden" name="boost[content]" id="boost_content" value="👏">
          <button name="button" type="submit" title="Clapping" class="btn message__action-btn" data-emoji="👏">
            <figure class="margin-none boost-character">👏</figure>
            <span class="for-screen-reader">Clapping</span>
          </button>
        </form>
        <form data-turbo-frame="boosting_message_{{ param }}" data-action="popup#close" action="/messages/{{ id }}/boosts" accept-charset="UTF-8" method="post">
          <input type="hidden" name="boost[content]" id="boost_content" value="👋">
          <button name="button" type="submit" title="Waving hand" class="btn message__action-btn" data-emoji="👋">
            <figure class="margin-none boost-character">👋</figure>
            <span class="for-screen-reader">Waving hand</span>
          </button>
        </form>
        <form data-turbo-frame="boosting_message_{{ param }}" data-action="popup#close" action="/messages/{{ id }}/boosts" accept-charset="UTF-8" method="post">
          <input type="hidden" name="boost[content]" id="boost_content" value="💪">
          <button name="button" type="submit" title="Muscle" class="btn message__action-btn" data-emoji="💪">
            <figure class="margin-none boost-character">💪</figure>
            <span class="for-screen-reader">Muscle</span>
          </button>
        </form>
        <form data-turbo-frame="boosting_message_{{ param }}" data-action="popup#close" action="/messages/{{ id }}/boosts" accept-charset="UTF-8" method="post">
          <input type="hidden" name="boost[content]" id="boost_content" value="❤️">
          <button name="button" type="submit" title="Red heart" class="btn message__action-btn" data-emoji="❤️">
            <figure class="margin-none boost-character">❤️</figure>
            <span class="for-screen-reader">Red heart</span>
          </button>
        </form>
        <form data-turbo-frame="boosting_message_{{ param }}" data-action="popup#close" action="/messages/{{ id }}/boosts" accept-charset="UTF-8" method="post">
          <input type="hidden" name="boost[content]" id="boost_content" value="😂">
          <button name="button" type="submit" title="Face with tears of joy" class="btn message__action-btn" data-emoji="😂">
            <figure class="margin-none boost-character">😂</figure>
            <span class="for-screen-reader">Face with tears of joy</span>
          </button>
        </form>
        <form data-turbo-frame="boosting_message_{{ param }}" data-action="popup#close" action="/messages/{{ id }}/boosts" accept-charset="UTF-8" method="post">
          <input type="hidden" name="boost[content]" id="boost_content" value="🎉">
          <button name="button" type="submit" title="Party popper" class="btn message__action-btn" data-emoji="🎉">
            <figure class="margin-none boost-character">🎉</figure>
            <span class="for-screen-reader">Party popper</span>
          </button>
        </form>
        <form data-turbo-frame="boosting_message_{{ param }}" data-action="popup#close" action="/messages/{{ id }}/boosts" accept-charset="UTF-8" method="post">
          <input type="hidden" name="boost[content]" id="boost_content" value="🔥">
          <button name="button" type="submit" title="Fire" class="btn message__action-btn" data-emoji="🔥">
            <figure class="margin-none boost-character">🔥</figure>
            <span class="for-screen-reader">Fire</span>
          </button>
        </form>

        <a class="btn message__action-btn message__boost-btn" data-turbo-frame="new_boost_message_{{ param }}" data-action="soft-keyboard#open popup#close" href="/messages/{{ id }}/boosts/new">
          <img class="colorize--black" aria-hidden="true" src="{{ asset_path "boost.svg" }}" width="20" height="20">
          <span class="for-screen-reader">New boost</span>
        </a>
      </div>

      <div class="flex flex-wrap border-top margin-block-start-half pad-block-start-half message__actions-grid">
        {% for p in presentation %}
        {% if p.is_text %}
        <button class="btn message__action-btn center full-width" data-action="reply#reply" title="Reply" aria-label="Reply">
          <img class="colorize--black" aria-hidden="true" src="{{ asset_path "reply.svg" }}" width="20" height="20">
        </button>
        {% else %}
        <a class="btn message__action-btn center full-width hide-in-ios-pwa" title="Download" aria-label="Download" href="/rails/active_storage/blobs/redirect/{{ active_storage_blob_id p.blob_id, secret: :secret_key }}/{{ p.filename_path }}?disposition=attachment">
          <img class="colorize--black" aria-hidden="true" src="{{ asset_path "download.svg" }}" width="20" height="20">
        </a>

        <button class="btn message__action-btn center full-width" title="Share" aria-label="Share" data-controller="web-share" data-action="web-share#share" data-web-share-files-value="/rails/active_storage/blobs/redirect/{{ active_storage_blob_id p.blob_id, secret: :secret_key }}/{{ p.filename_path }}" data-web-share-title-value="{{ p.filename }}">
          <img class="colorize--black" aria-hidden="true" src="{{ asset_path "share.svg" }}" width="20" height="20">
        </button>
        {% endif %}
        {% endfor %}

        <button class="btn message__action-btn center full-width" title="Copy link" aria-label="Copy link" data-controller="copy-to-clipboard" data-action="copy-to-clipboard#copy" data-copy-to-clipboard-success-class="btn--success" data-copy-to-clipboard-content-value="{{ base_url }}/rooms/{{ room_id }}/@{{ id }}">
          <img class="colorize--black" aria-hidden="true" src="{{ asset_path "link.svg" }}" width="20" height="20">
        </button>

        <a class="btn message__action-btn center full-width message__edit-btn" data-turbo-frame="edit_message_{{ param }}" title="Edit" aria-label="Edit" href="/rooms/{{ room_id }}/messages/{{ id }}/edit">
          <img class="colorize--black" aria-hidden="true" src="{{ asset_path "pencil.svg" }}" width="20" height="20">
        </a>
      </div>
    </div>
  </details>
</div>
